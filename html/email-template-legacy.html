<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Type" content="text/html charset=UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;700&amp;family=Open+Sans&amp;display=swap" rel="stylesheet">
  <style type="text/css">
    table {
      border-collapse:separate;
    }

    a, a:link, a:visited {
      text-decoration: none;
      color: #8350E6;
    }

    a:hover {
      text-decoration: underline;
    }

    .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td {
      line-height: 100%;
    }

    .ExternalClass {
      width: 100%;
    }
  </style></head>



<body style="font-family: Arial, serif; background: #F8F9FB;">
<div style="padding: 32px 0; background: #F8F9FB; width: 100%;">
  <div style="max-width: 600px; margin: 0 auto; width:96%;">
    <table style="width: 100%; padding: 0 16px;" cellspacing="0" cellpadding="0" border="0">
      <tbody><tr>
        <td>
          <img alt="Selia" src="https://s3.amazonaws.com/images.app.selia/logo-sm.png" width="84" height="24.93">
        </td>
      </tr>
      </tbody></table>

    <table style="width: 100%; margin: 16px 0 24px; padding: 48px 32px; background: #FFFFFF; border-bottom: 4px solid #EFF1F5; border-radius: 16px;" cellspacing="0" cellpadding="0" border="0">
      <tbody><tr>
        <td>
          {{content}}
        </td>
      </tr>
      </tbody></table>

    <table style="width: 100%; padding: 0 16px;" cellspacing="0" cellpadding="0" border="0">
      <tbody><tr>
        <td style="width: 20px; height: 20px; vertical-align: center; padding-right: 5px;">
          <a href="https://www.facebook.com/selialatam" style="text-decoration: none; height: 24px; display: block;">
            <img alt="FB"height="18" width="18" src="https://s3.amazonaws.com/images.app.selia/fb.png" />
          </a>
        </td>

        <td style="width: 20px; height: 20px; vertical-align: center; padding-right: 8px;">
          <a href="https://twitter.com/co_selia" style="text-decoration: none; height: 24px; display: block;">
            <img alt="TW"height="20" width="20" src="https://s3.amazonaws.com/images.app.selia/tw.png" />
          </a>
        </td>

        <td style="width: 20px; height: 20px; vertical-align: center; padding-right: 8px;">
          <a href="https://www.instagram.com/selia.co/" style="text-decoration: none; display: block;">
            <img alt="IG" height="20" width="20" src="https://s3.amazonaws.com/images.app.selia/ig.png" />
          </a>
        </td>

        <td style="width: 20px; height: 20px; vertical-align: center;">
          <a href="https://www.linkedin.com/company/seliaco/" style="text-decoration: none; height: 24px; display: block;">
            <img alt="IN"height="19" width="19" src="https://s3.amazonaws.com/images.app.selia/in.png" />
          </a>
        </td>

        <td style="width: auto"></td>

        <td style="width: 200px; text-align: right; vertical-align: center;">
          <a style="color: #8D91A0; font-size: 11px;" href="https://users.selia.co/settings/notifications">Opt out of these messages</a>
          <span style="color: #8D91A0; font-size: 11px;">|</span>
          <a style="color: #8D91A0; font-size: 11px;" href="https://selialatam.typeform.com/to/rxShZGho">Leave us your opinion</a>
          <a style="color: #8350E6; font-size: 11px; line-height: 20px; display: block" href="https://selia.co">www.selia.co</a>
        </td>
      </tr>
      </tbody></table>
  </div>
</div>
</body></html>
