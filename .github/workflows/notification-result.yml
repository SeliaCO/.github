name: Send Result Notification

on:
  workflow_call:
    inputs:
      result:
        description: >-
          Resultado del job de deploy, para que el caller pueda notificar un fallo.
          El caller lo pasa como `needs.<job>.result` junto con `if: always()`, porque
          sin `always()` este job se saltea cuando el deploy falla y el fallo nunca se
          avisa. Opcional: si no se pasa, vale 'success' y el comportamiento es el de
          siempre (los callers que no lo usan no cambian).

          Valores posibles: success, failure, cancelled, skipped. El aviso de fallo se
          manda SOLO con 'failure': un deploy `cancelled` es el `concurrency` haciendo
          su trabajo —llego un push mas nuevo y el anterior se descarta— y avisarlo como
          fallo entrena a la gente a ignorar el canal.
        type: string
        required: false
        default: success

jobs:
  notify_in_progress:
    runs-on: ubuntu-latest
    steps:
      - name: Set Workflow Link
        id: workflow_link
        run: echo "##[set-output name=link]https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Set Branch Name
        id: branch_name
        run: |
          ref=${{ github.ref }}
          branch_name=${ref#refs/heads/}
          echo "##[set-output name=name;]$branch_name"

      - name: Checkout
        uses: actions/checkout@v2

      - name: Send notification - Completed
        if: ${{ success() && inputs.result == 'success' }}
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "app_name": "${{ github.repository }}",
              "branch": "${{ steps.branch_name.outputs.name }}",
              "workflow_link": "${{ steps.workflow_link.outputs.link }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY_COMPLETED }}

      - name: Send notification - Failed
        if: ${{ always() && inputs.result == 'failure' }}
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "app_name": "${{ github.repository }}",
              "branch": "${{ steps.branch_name.outputs.name }}",
              "workflow_link": "${{ steps.workflow_link.outputs.link }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY_FAILED }}
